<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 4 - Semantic and Non-Semantic</title>
  <style>
    header, nav, main, section, article, aside, footer, div { border: 1px solid #555; margin: 5px; padding: 8px; }
  </style>
</head>
<body>
  <h2>Semantic Layout</h2>
  <header>Header: site title</header>
  <nav>Nav: Home | About | Contact</nav>
  <main>
    <section>Section: a group of related content</section>
    <article>Article: independent content such as a blog post</article>
    <aside>Aside: side information</aside>
  </main>
  <footer>Footer: &copy; 2026</footer>

  <h2>Non-Semantic Layout (div only)</h2>
  <div id="header">Header (div)</div>
  <div id="nav">Nav (div)</div>
  <div id="main">
    <div>Section (div)</div>
    <div>Article (div)</div>
    <div>Aside (div)</div>
  </div>
  <div id="footer">Footer (div)</div>
</body>
</html>

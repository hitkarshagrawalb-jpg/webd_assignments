<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 15 - Form Inputs</title>
</head>
<body>
  <form>
    <fieldset>
      <legend>Registration Form</legend>

      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name"><br><br>

      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email"><br><br>

      <label for="pass">Password:</label><br>
      <input type="password" id="pass" name="pass"><br><br>

      <label for="dob">Date of Birth:</label><br>
      <input type="date" id="dob" name="dob"><br><br>

      Gender:
      <input type="radio" id="m" name="gender" value="male"><label for="m">Male</label>
      <input type="radio" id="f" name="gender" value="female"><label for="f">Female</label><br><br>

      Hobbies:
      <input type="checkbox" id="h1" name="hobby" value="reading"><label for="h1">Reading</label>
      <input type="checkbox" id="h2" name="hobby" value="music"><label for="h2">Music</label><br><br>

      <label for="photo">Photo:</label>
      <input type="file" id="photo" name="photo"><br><br>

      <label for="color">Favourite colour:</label>
      <input type="color" id="color" name="color">
    </fieldset>
  </form>
</body>
</html>

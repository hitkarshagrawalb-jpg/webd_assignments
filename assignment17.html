<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 17 - Form Validation</title>
</head>
<body>
  <h2>Registration</h2>
  <form action="submit.php" method="post">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="mobile">Mobile:</label><br>
    <input type="text" id="mobile" name="mobile" pattern="[0-9]{10}" title="Enter exactly 10 digits" required><br><br>

    <label for="password">Password (min 8 characters):</label><br>
    <input type="password" id="password" name="password" minlength="8" maxlength="20" required><br><br>

    <label for="age">Age (18 to 30):</label><br>
    <input type="number" id="age" name="age" min="18" max="30" required><br><br>

    <button type="submit">Register</button>
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 10 - Multimedia</title>
</head>
<body>
  <h1>Multimedia Page</h1>

  <h2>Image</h2>
  <img src="https://via.placeholder.com/400x200.png?text=Image" alt="Sample image" width="400">

  <h2>Video</h2>
  <video width="400" controls poster="https://via.placeholder.com/400x225.png?text=Video">
    <source src="sample.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <h2>Audio</h2>
  <audio controls>
    <source src="sample.mp3" type="audio/mpeg">
    Your browser does not support the audio tag.
  </audio>

  <h2>YouTube Video</h2>
  <iframe width="480" height="270" src="https://www.youtube.com/embed/dQw4w9WgXcQ"
          title="YouTube video player" allowfullscreen></iframe>
</body>
</html>

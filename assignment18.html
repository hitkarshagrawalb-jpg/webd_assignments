<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>ABC College Admission 2026</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; }
    header, footer { background: #1a237e; color: #fff; text-align: center; padding: 20px; }
    footer { padding: 12px; margin-top: 20px; }
    main { max-width: 560px; margin: 0 auto; padding: 10px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
    th, td { border: 1px solid #999; padding: 6px 8px; text-align: left; }
    th { background: #e8eaf6; text-align: center; }
    .skip-link { position: absolute; left: -999px; }
    .skip-link:focus { left: 10px; top: 10px; background: #ffff99; color: #000; padding: 6px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#form">Skip to application form</a>

  <header>
    <h1>ABC College Admission 2026</h1>
  </header>

  <main>
    <section>
      <h2>Courses and Fees</h2>
      <table>
        <caption>Available Courses</caption>
        <thead>
          <tr><th scope="col">Course</th><th scope="col">Seats</th><th scope="col">Fees</th></tr>
        </thead>
        <tbody>
          <tr><td>B.Tech CSE</td><td>120</td><td>&#8377;90,000</td></tr>
          <tr><td>BCA</td><td>60</td><td>&#8377;45,000</td></tr>
        </tbody>
      </table>
    </section>

    <section>
      <form id="form" action="submit.php" method="post">
        <fieldset>
          <legend>Application Form</legend>

          <p>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required>
          </p>
          <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
          </p>
          <p>
            <label for="course">Course:</label><br>
            <select id="course" name="course" required>
              <option>B.Tech CSE</option>
              <option>BCA</option>
            </select>
          </p>
          <p>
            <label for="statement">Statement:</label><br>
            <textarea id="statement" name="statement" rows="3" cols="45" maxlength="300"></textarea>
          </p>
          <p><button type="submit">Apply</button></p>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ABC College</p>
  </footer>
</body>
</html>

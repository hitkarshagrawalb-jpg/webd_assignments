<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 3 - Block and Inline Elements</title>
  <style>
    div { background: #cfe8ff; margin: 5px 0; padding: 5px; }
    p   { background: #d4f5d4; }
    span, a, strong { background: #ffe9a8; }
  </style>
</head>
<body>
  <h2>Block elements (take the full width, start on a new line)</h2>
  <div>This is a div</div>
  <p>This is a paragraph</p>
  <h3>This is a heading</h3>

  <h2>Inline elements (take only needed width, stay in the line)</h2>
  <p>This is <span>a span</span>, <a href="#">a link</a> and <strong>strong text</strong> in one line.</p>
</body>
</html>

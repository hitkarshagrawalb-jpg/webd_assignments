<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 12 - Table</title>
  <style>
    table { border-collapse: collapse; width: 60%; }
    th, td { border: 1px solid #888; padding: 6px 10px; text-align: left; }
    thead, tfoot { background: #e8eaf6; }
  </style>
</head>
<body>
  <table>
    <caption>Student Marks</caption>
    <thead>
      <tr><th>Roll No</th><th>Name</th><th>Marks</th></tr>
    </thead>
    <tbody>
      <tr><td>1</td><td>Aman</td><td>85</td></tr>
      <tr><td>2</td><td>Riya</td><td>92</td></tr>
      <tr><td>3</td><td>Karan</td><td>78</td></tr>
    </tbody>
    <tfoot>
      <tr><td colspan="2">Total</td><td>255</td></tr>
    </tfoot>
  </table>
</body>
</html>
